<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — Essenza</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="brand">Ess<span>enza</span></a>
      <p class="auth-subtitle">Entre na sua conta para continuar</p>

      <form>
        <div class="form-group">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" />
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>

      <div class="auth-divider">ou</div>

      <p class="auth-footer">Não tem conta? <a href="#">Cadastre-se grátis</a></p>
      <p class="auth-footer" style="margin-top:8px"><a href="#">Esqueceu sua senha?</a></p>
    </div>
  </div>
</body>
</html>
